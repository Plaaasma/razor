[package]
name = "razor"
version = "0.18.0"
edition = "2024"

[dependencies]
# Syzygy endgame tablebases. Razor is otherwise zero-dependency; these are the
# one accepted exception (a correct .rtbw/.rtbz decoder is not worth hand-porting).
shakmaty = "0.30"
shakmaty-syzygy = "0.28"

[features]
default = ["fused", "cfused"]
fused = []
cfused = []
# DIAGNOSTIC: widen the NNUE accumulator to 1024 for the SF-class arch experiment.
# Used only with RAZOR_EQH=<1024 eqh net>; the embedded 768 net is unused in this
# build (do not run it without RAZOR_EQH set).
h1024 = []
noprefetch = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# release with debug assertions, for perft/zobrist verification runs
[profile.release-dbg]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true
panic = "unwind"
