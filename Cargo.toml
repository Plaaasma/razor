[package]
name = "razor"
version = "0.17.0"
edition = "2024"

[dependencies]
# Syzygy endgame tablebases. Razor is otherwise zero-dependency; these are the
# one accepted exception (a correct .rtbw/.rtbz decoder is not worth hand-porting).
shakmaty = "0.30"
shakmaty-syzygy = "0.28"

[features]
default = ["fused", "cfused"]
fused = []
cfused = []
noprefetch = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# release with debug assertions, for perft/zobrist verification runs
[profile.release-dbg]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true
panic = "unwind"
